<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Jersey Dodgers forms</title></head>
<body>
  <form name="player-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="player-interest">
    <input name="bot-field">
    <input name="name">
    <input name="email" type="email">
    <input name="phone" type="tel">
    <input name="season">
    <input name="position">
    <textarea name="experience"></textarea>
  </form>
  <form name="sponsor-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="sponsor-interest">
    <input name="bot-field">
    <input name="name">
    <input name="email" type="email">
    <input name="phone" type="tel">
    <input name="website" type="url">
    <textarea name="message"></textarea>
  </form>
</body>
</html>
